name: Upload multi-arch images

# Ported from upstream upload_image.yml: per-arch build + manifest list publish.
# Form3 fork CI (ci.yaml / build_targets.yaml) keeps amd64 artifacts for tests.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to publish (without arch suffix)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        type: string
  push:
    tags:
      - "v*-f3-*"

permissions: read-all

jobs:
  build-specific-architecture:
    if: github.repository_owner == 'form3tech-oss'
    permissions:
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        image:
          [chaos-daemon, chaos-mesh, chaos-dashboard, chaos-kernel, chaos-dlv]
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up buildx
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            docker run --privileged --rm tonistiigi/binfmt --install all
          fi
          docker buildx rm chaos-mesh-builder 2>/dev/null || true
          docker buildx create --use --name chaos-mesh-builder
          docker buildx inspect --bootstrap

      - name: Extract image tag
        id: image_tag
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Chaos Mesh
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.image_tag }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          if [ "${IMAGE}" = "chaos-dashboard" ]; then
            UI=1
          else
            UI=0
          fi

          make -B \
            TARGET_PLATFORM=$ARCH \
            IMAGE_TAG=$IMAGE_TAG-$ARCH \
            IMAGE_DEV_ENV_BUILD=1 \
            IMAGE_BUILD_ENV_BUILD=1 \
            UI=$UI \
            image-$IMAGE

      - name: Push image
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.image_tag }}
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ matrix.image }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          SRC_IMAGE=ghcr.io/chaos-mesh/${IMAGE}:${IMAGE_TAG}-${ARCH}
          DST_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chaos-mesh/${IMAGE}:${IMAGE_TAG}-${ARCH}
          docker tag "${SRC_IMAGE}" "${DST_IMAGE}"
          docker push "${DST_IMAGE}"

  upload-manifest:
    needs: build-specific-architecture
    if: github.repository_owner == 'form3tech-oss'
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    strategy:
      matrix:
        image:
          [chaos-daemon, chaos-mesh, chaos-dashboard, chaos-kernel, chaos-dlv]
    env:
      IMAGE_TAG: ${{ needs.build-specific-architecture.outputs.image_tag }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Login to GitHub Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools create -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chaos-mesh/$IMAGE:$IMAGE_TAG \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chaos-mesh/$IMAGE:$IMAGE_TAG-amd64 \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chaos-mesh/$IMAGE:$IMAGE_TAG-arm64
