name: Check markdown links

on:
  workflow_call: {}

permissions: read-all

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      any-changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 2

      - name: Get changed files
        uses: step-security/changed-files@95b56dadb92a30ca9036f16423fd3c088a71ee94 # v46
        id: filter
        with:
          files: |
            **.md
            .github/checklink_config.json

  markdown-link-check:
    needs: changed-files
    if: needs.changed-files.outputs.any-changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: "yes"
          check-modified-files-only: 'yes'
          config-file: ".github/checklink_config.json"
