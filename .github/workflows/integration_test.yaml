name: Integration test

on:
  workflow_call:
    inputs:
      images-artifact-name:
        description: "Name of the images artifact"
        type: string
        required: true

permissions: read-all

jobs:
  run:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          # Must use at least depth 2!
          fetch-depth: 2

      - name: Download saved images
        id: download-images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.images-artifact-name }}
          path: ./output/${{ inputs.images-artifact-name }}

      - name: Load images into docker
        run: |
          docker load --input ./output/${{ inputs.images-artifact-name }}/chaos-dashboard.tgz
          docker load --input ./output/${{ inputs.images-artifact-name }}/chaos-daemon.tgz
          docker load --input ./output/${{ inputs.images-artifact-name }}/chaos-mesh.tgz

      - name: Create kind cluster
        uses: helm/kind-action@4c7909140acfc81a05fc96fed8fea6673ba8ce80
        with:
          version: v0.26.0
          kubectl_version: v1.30.4
          node_image: kindest/node:v1.30.4

      - name: Restrict access to kubeconfig # https://github.com/helm/helm/issues/9115
        run: chmod 600 ~/.kube/config

      - name: Setup Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2

      - name: Load images into kind
        run: |
          kind load docker-image --name chart-testing ghcr.io/chaos-mesh/chaos-dashboard:latest
          kind load docker-image --name chart-testing ghcr.io/chaos-mesh/chaos-daemon:latest
          kind load docker-image --name chart-testing ghcr.io/chaos-mesh/chaos-mesh:latest

      - name: Install Chaos Mesh
        run: |
          # kind nodes use containerd; default helm values target docker and can leave
          # chaos CRs stuck in deletion, so the dashboard collector never archives them.
          helm install --wait --create-namespace chaos-mesh helm/chaos-mesh \
            -n=chaos-mesh \
            --set images.tag=latest \
            --set chaosDaemon.runtime=containerd \
            --set chaosDaemon.socketPath=/run/containerd/containerd.sock
          kubectl rollout status deployment/chaos-dashboard -n chaos-mesh --timeout=180s
          kubectl rollout status deployment/chaos-controller-manager -n chaos-mesh --timeout=180s
          kubectl port-forward -n chaos-mesh svc/chaos-dashboard 2333:2333 &

      - name: Install localstack && aws client
        run: |
          helm repo add localstack https://localstack.github.io/helm-charts
          helm upgrade --install localstack localstack/localstack \
            --version 0.6.27 \
            --set image.tag=4.14.0
          pip install awscli
          kubectl wait --timeout=180s --for=condition=ready pod -l app.kubernetes.io/name=localstack

      - name: Run integration test
        run: |
          bash test/integration_test/run.sh

      - name: Post run - dump kubernetes cluster info
        if: always()
        run: |
          kubectl cluster-info dump --all-namespaces --output-directory cluster-info-dump

      - name: Post run - upload kubernetes cluster info dump
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-kubernetes-cluster-info-dump
          path: cluster-info-dump
          retention-days: 7
