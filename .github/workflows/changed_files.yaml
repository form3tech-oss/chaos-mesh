name: Detect changes files

on:
    workflow_call:
      outputs:
        only_changed:
          description: "Whether only the specified files have changed."
          value: ${{ jobs.changed-files.outputs.only_changed }}

permissions: read-all

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      only_changed: ${{ steps.filter.outputs.only_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 2

      - name: Get changed files
        uses: step-security/changed-files@95b56dadb92a30ca9036f16423fd3c088a71ee94 # v46
        id: filter
        with:
          files: |
            .gitignore
            **.md
            ui/**
            .github/**

      - name: Echo changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.filter.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            echo "$file was changed"
          done
